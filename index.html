<script>
  const correctPin = "21196";
  let accessGranted = false;

  // Prompt for PIN on page load
  window.onload = function() {
    const userPin = prompt("Enter PIN to access the map:");
    if (userPin === correctPin) {
      accessGranted = true;
      alert("Access granted!");
    } else {
      alert("Wrong PIN! You cannot use the map.");
    }
  };

  async function searchAddress() {
    if (!accessGranted) {
      alert("You must enter the correct PIN first.");
      return;
    }

    const addressInput = document.getElementById('address').value;
    if (!addressInput) return;

    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(addressInput)}`
      );

      const data = await res.json();

      if (data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);
        currentLat = lat;
        currentLon = lon;

        const addressDetails = data[0].address;

        // Full address
        let fullAddress = "";
        if (addressDetails.road) fullAddress += addressDetails.road + ", ";
        if (addressDetails.city) fullAddress += addressDetails.city + ", ";
        if (addressDetails.county) fullAddress += addressDetails.county + ", ";
        if (addressDetails.state) fullAddress += addressDetails.state + ", ";
        if (addressDetails.postcode) fullAddress += addressDetails.postcode + ", ";
        if (addressDetails.country) fullAddress += addressDetails.country;

        if (marker) map.removeLayer(marker);

        marker = L.marker([lat, lon], { icon: houseIcon }).addTo(map)
          .bindPopup(fullAddress)
          .openPopup();

        map.flyTo([lat, lon], 15, { duration: 2 });

        // Street View
        const streetViewUrl = `https://www.google.com/maps?q=&layer=c&cbll=${lat},${lon}&cbp=11,0,0,0,0&output=svembed`;
        document.getElementById("streetview").src = streetViewUrl;

        // Show coordinates
        document.getElementById("coords").innerText = `Latitude: ${lat}, Longitude: ${lon}`;

        // Show local time
        const localTime = new Date().toLocaleTimeString("en-US", { timeZone: "America/Chicago" });
        document.getElementById("localTime").innerText = `Local Time (demo timezone): ${localTime}`;

        // Address table
        const table = document.getElementById("addressDetails");
        table.innerHTML = `
          <tr><td>Road:</td><td>${addressDetails.road || "-"}</td></tr>
          <tr><td>City:</td><td>${addressDetails.city || "-"}</td></tr>
          <tr><td>County:</td><td>${addressDetails.county || "-"}</td></tr>
          <tr><td>State:</td><td>${addressDetails.state || "-"}</td></tr>
          <tr><td>Postcode:</td><td>${addressDetails.postcode || "-"}</td></tr>
          <tr><td>Country:</td><td>${addressDetails.country || "-"}</td></tr>
        `;

        // Save to search history
        searchHistory.unshift({lat, lon, fullAddress});
        if (searchHistory.length > 5) searchHistory.pop();
        updateHistory();

      } else {
        alert("Address not found");
      }
    } catch (err) {
      console.error(err);
      alert("Error searching address");
    }
  }

  // Directions button
  document.getElementById("directionsBtn").onclick = () => {
    if (!accessGranted) {
      alert("You must enter the correct PIN first.");
      return;
    }
    if (!currentLat || !currentLon) {
      alert("Search for an address first!");
      return;
    }
    const url = `https://www.google.com/maps/dir/?api=1&destination=${currentLat},${currentLon}`;
    window.open(url, "_blank");
  }
</script>
